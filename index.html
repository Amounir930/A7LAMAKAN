<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahla Makan - أحلى مكان للاستقدام والخدمات المنزلية</title>
  
  <!-- SEO & Favicon -->
  <link rel="icon" type="image/png" href="/LOGO.png">
  
  <!-- Immediate redirection -->
  <meta http-equiv="refresh" content="0; url=/ar">
  
  <script>
    // Try to detect user's preferred browser language
    try {
      var userLang = navigator.language || navigator.userLanguage;
      if (userLang && userLang.toLowerCase().startsWith('en')) {
        window.location.replace("/en");
      } else {
        window.location.replace("/ar");
      }
    } catch (e) {
      window.location.replace("/ar");
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #666;">
    Redirecting to /ar... / جاري تحويلك إلى أحلى مكان للاستقدام...
  </p>
</body>
</html>
